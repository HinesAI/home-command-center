services:
  core:
    image: python:3.11-slim
    restart: unless-stopped
    command: ["sh", "-c", "pip install -q -r /app/requirements.txt && python /app/server.py"]
    working_dir: /app
    volumes:
      - ../apps/core:/app
      - ../VERSION:/app/VERSION:ro
      - hcc-core-data:/app/data
    env_file:
      - .env
    environment:
      HCC_CORE_PORT: "8080"
      HCC_REFRESH_SECONDS: "120"
      HCC_HEARTBEAT_TTL_SECONDS: "360"
      HCC_STORAGE_PATHS: "/,/srv,/mnt/storage,/media/storage"
      HCC_SERVICES: "docker,ssh,ufw"
      HCC_CONTAINERS: "nextcloud,jellyfin,mariadb,postgres,redis,nginx,traefik,caddy"
      HCC_AUTH_ENABLED: "true"
      HCC_WEB_BASE_URL: "http://hcc.example.local/downloads"
      HCC_VERSION_PATH: "/app/VERSION"
      HCC_RELEASE_CHANNEL: "stable"
      HCC_SETTINGS_FILE: "/app/data/hcc-settings.env"
      # Family board — phones manage via CalDAV (Calendar.app / Reminders)
      HCC_CALDAV_URL: "${HCC_CALDAV_URL:-http://caldav:5232}"
      HCC_CALDAV_USER: "${HCC_CALDAV_USER:-family}"
      HCC_CALDAV_PASSWORD: "${HCC_CALDAV_PASSWORD:-}"
      HCC_CALDAV_EVENTS_CALENDAR: "${HCC_CALDAV_EVENTS_CALENDAR:-/family/family/}"
      HCC_CALDAV_CHORES_CALENDAR: "${HCC_CALDAV_CHORES_CALENDAR:-/family/chores/}"
      HCC_CALDAV_VERIFY_TLS: "${HCC_CALDAV_VERIFY_TLS:-false}"
    ports:
      - "18080:8080"
    depends_on:
      - caldav
  agent:
    image: python:3.11-slim
    restart: unless-stopped
    command: ["python", "/app/heartbeat_sender.py"]
    working_dir: /app
    volumes:
      - ../apps/agent:/app
    environment:
      HCC_CORE_HEARTBEAT_URL: "http://core:8080/api/v1/agent/heartbeat"
      HCC_AGENT_INTERVAL_SECONDS: "120"
      HCC_AGENT_NODE_ID: "agent-lab-01"
      HCC_AGENT_ID: "agent-lab-01"
      HCC_STORAGE_PATHS: "/,/srv,/mnt/storage,/media/storage"
      HCC_SERVICES: "docker,ssh,ufw"
      HCC_CONTAINERS: "nextcloud,jellyfin,mariadb,postgres,redis,nginx,traefik,caddy"
    depends_on:
      - core
  web:
    image: python:3.11-slim
    restart: unless-stopped
    command: ["python", "-m", "http.server", "3000", "-d", "/app"]
    working_dir: /app
    volumes:
      - ../apps/web:/app
    ports:
      - "3000:3000"
    depends_on:
      - core
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
      - core

  # Apple Calendar / Reminders write here; HCC Core only reads for wall/Family display.
  caldav:
    image: tomsquest/docker-radicale:3.5.0.0
    restart: unless-stopped
    ports:
      - "15232:5232"
    volumes:
      - hcc-caldav-data:/data
      - ./radicale:/config:ro
    security_opt:
      - no-new-privileges:true

volumes:
  hcc-core-data:
  hcc-caldav-data:
