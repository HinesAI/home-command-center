name: hcc

services:
  core:
    image: hcc-core:${HCC_VERSION:-2.1.0}
    restart: unless-stopped
    env_file:
      - ${HCC_CONFIG_FILE:-/etc/hcc/hcc.env}
    environment:
      HCC_CORE_HOST: "0.0.0.0"
      HCC_CORE_PORT: "8080"
      HCC_FLEET_STATE_PATH: "/app/data/fleet-state.json"
      HCC_ACTION_STATE_PATH: "/app/data/action-state.json"
      HCC_VERSION_PATH: "/app/VERSION"
      HCC_VERSION: ${HCC_VERSION:-2.1.0}
      HCC_RELEASE_CHANNEL: ${HCC_RELEASE_CHANNEL:-stable}
    volumes:
      - hcc-core-data:/app/data
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

  web:
    image: hcc-web:${HCC_VERSION:-2.1.0}
    restart: unless-stopped
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HCC_BIND_ADDRESS:-0.0.0.0}:${HCC_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
    depends_on:
      core:
        condition: service_healthy
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  hcc-core-data:
